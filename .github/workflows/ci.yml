name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Install project
        run: python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check candidate manifest in source distribution
        run: python -I -c "import tarfile; from pathlib import Path; archives = list(Path('dist').glob('*.tar.gz')); assert len(archives) == 1; archive = tarfile.open(archives[0]); assert any(name.endswith('/docs/studies/refund-family-candidates-v1.json') for name in archive.getnames()); archive.close()"
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist consequa-x
      - name: Check installed package and bundled schema
        run: python -I -c "from consequa_x.schema import get_trace_schema; from consequa_x.benchmark.runner import run_scenario; from consequa_x import Trace, explain; schema = get_trace_schema(); trace = run_scenario(seed=0).trace; assert Trace.from_json(trace.to_json()) == trace; assert schema[chr(36) + 'schema'].endswith('/2020-12/schema'); assert explain(trace).diagnosis == 'BELIEF / RESPONSE DIVERGENCE'"
      - name: Check installed policy evaluation without a model
        run: python -I -m consequa_x model-eval --provider scripted --samples 1 --max-calls 30 --output output/ci-policy-smoke
      - name: Check installed paired replay without a model
        run: python -I -m consequa_x model-experiment --provider scripted --samples 2 --max-calls 30 --output output/ci-policy-replay
      - name: Check installed candidate split without a model
        run: python -I -m consequa_x model-eval --provider scripted --study docs/studies/refund-family-candidates-v1.json --split tuning --samples 1 --seed 100 --order-seed 7 --max-calls 30 --output output/ci-study-tuning
      - name: Check installed three-target replay without a model
        run: python -I -m consequa_x model-experiment --provider scripted --case clean --candidates vip_policy --samples 2 --seed 200 --targets action,consequence,action_linked_consequence --template refund-support-note-v1 --max-calls 12 --output output/ci-three-target-replay
      - name: Check installed decision-prefix replay without a model
        run: python -I -c "from consequa_x.benchmark.decision_replay import replay_decision_prefix; from consequa_x.benchmark.evaluation import BudgetedPolicy; from consequa_x.benchmark.payments import Fault; from consequa_x.benchmark.policy_runner import run_policy_scenario; from consequa_x.benchmark.runner import ScenarioConfig; from consequa_x.policies import ScriptedRefundPolicy; policy = ScriptedRefundPolicy(); factual = run_policy_scenario(ScenarioConfig(fault=Fault.CLEAN), policy, seed=0); bounded = BudgetedPolicy(policy, max_calls=1); held = replay_decision_prefix(factual, bounded, hold_count=2, continuation_seed=100); assert held.episode is not None and held.policy_calls == bounded.calls == 0; suffix = replay_decision_prefix(factual, bounded, hold_count=1, continuation_seed=101); assert suffix.episode is not None and suffix.policy_calls == bounded.calls == 1"
      - name: Check installed decision contrastive replay without a model
        run: python -I -m consequa_x decision-experiment --provider scripted --case unsafe_retry --samples 2 --seed 100 --factual-seed 0 --targets consequence,action_linked_consequence --max-calls 20 --bootstrap-samples 200 --output output/ci-decision-contrastive
      - name: Check installed decision Shapley replay without a model
        run: python -I -m consequa_x decision-shapley --provider scripted --case clean --pairs 2 --samples 1 --endpoint-samples 2 --seed 100 --factual-seed 0 --targets consequence,action_linked_consequence --max-calls 30 --output output/ci-decision-shapley
      - name: Check installed offline attribution calibration
        run: python -I -m consequa_x calibrate-attribution --replicates 2 --samples 2 --pairs 2 --endpoint-samples 2 --bootstrap-samples 20 --output output/ci-calibration
