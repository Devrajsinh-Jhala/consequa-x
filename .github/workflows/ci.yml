name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -r requirements-dev.lock
      - name: Install project
        run: python -m pip install -e .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist consequa-x
      - name: Check installed package and bundled schema
        run: python -I -c "from consequa_x.schema import get_trace_schema; from consequa_x.benchmark.runner import run_scenario; from consequa_x import Trace, explain; schema = get_trace_schema(); trace = run_scenario(seed=0).trace; assert Trace.from_json(trace.to_json()) == trace; assert schema[chr(36) + 'schema'].endswith('/2020-12/schema'); assert explain(trace).diagnosis == 'BELIEF / RESPONSE DIVERGENCE'"
