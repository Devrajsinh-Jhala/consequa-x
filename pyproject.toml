[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "consequa-x"
version = "2.1.0"
description = "Evidence-aware explanation of consequential agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Devrajsinh Jhala"}]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.8", "jsonschema>=4.23"]
otel = ["opentelemetry-api>=1.45"]
openai-agents = ["openai-agents>=0.24"]
langchain = ["langchain-core>=1.6"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.168"]

[project.urls]
Homepage = "https://consequa-x.onrender.com"
Documentation = "https://consequa-x.onrender.com/docs.html"
Changelog = "https://consequa-x.onrender.com/changelog.html"
Repository = "https://github.com/Devrajsinh-Jhala/consequa-x"
Issues = "https://github.com/Devrajsinh-Jhala/consequa-x/issues"
Security = "https://github.com/Devrajsinh-Jhala/consequa-x/security/policy"

[project.scripts]
consequa-x = "consequa_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
consequa_x = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
